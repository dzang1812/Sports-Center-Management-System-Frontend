# Replaces the backend's sportscenter-api.conf on the EC2: same default_server on :80,
# but now serves the React build at / and proxies only /api (and /swagger) to Kestrel on :5000.
# The FE calls relative /api, so no CORS setup is needed.
server {
    listen 80 default_server;
    server_name _;

    root /var/www/sportscenter-web;
    index index.html;

    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
    }

    location /swagger {
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
    }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback for react-router client routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
